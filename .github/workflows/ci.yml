name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  manifest:
    name: Validate action.yml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # hardening-exception: egress-audit — this job clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse action.yml
        run: python3 -c "import yaml; d=yaml.safe_load(open('action.yml')); assert d['runs']['using']=='composite'; print('OK', d['name'])"

  # These suites existed but ran only in release.yml, i.e. after the merge that
  # could break them. A manifest parse asserting `runs.using == composite` was
  # the entire merge gate for ~250 lines of quoting-sensitive shell that writes
  # the file governing where every later step downloads provider binaries from.
  behaviour:
    name: Behaviour and mutation suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # hardening-exception: egress-audit — this job clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the behaviour suite
        run: tests/run-tests.sh

      # The charset-locale guard defends a hazard that only EXISTS in a collating
      # locale: bash evaluates an ERE bracket range by LC_COLLATE, so [A-Za-z]
      # admits `ä` under en_US.UTF-8 and refuses it under C and C.UTF-8. Hosted
      # runners default to C.UTF-8, where the first CI run of this harness
      # reported the guard INERT — which, taken at face value, argues for
      # deleting a guard that is load bearing on every host where the hazard is
      # real. Generate the locale so the mutation is observable here.
      - name: Ensure a collating UTF-8 locale exists
        run: |
          set -euo pipefail
          if ! locale -a | grep -qiE '^en_US\.utf-?8$'; then
            sudo locale-gen en_US.UTF-8
          fi
          locale -a | grep -iE '^en_US\.utf-?8$'
      # Every guard has to be shown to be load bearing: disable it, and the rows
      # it owns must fail. A guard nobody has broken on purpose is a guard nobody
      # has tested.
      - name: Prove every guard is load bearing
        run: tests/mutations.sh

  lint:
    name: Lint the workflows and the embedded script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # hardening-exception: egress-audit — this job clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Release assets verified against their published digest before use, rather
      # than piping an install script into a shell.
      - name: Install actionlint and shellcheck
        run: |
          set -euo pipefail
          curl -sSfLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          curl -sSfL -o shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  shellcheck.tar.xz" | sha256sum -c -
          tar xJf shellcheck.tar.xz shellcheck-v0.10.0/shellcheck
          echo "$PWD" >> "$GITHUB_PATH"
          echo "$PWD/shellcheck-v0.10.0" >> "$GITHUB_PATH"

      - name: actionlint
        run: ./actionlint -color

      # The implementation is quoting-sensitive bash inside a YAML block scalar,
      # which shellcheck cannot see unless it is deliberately extracted — so
      # nothing had ever linted it. Quoting regressions in exactly this script
      # are the mechanism by which the HCL-injection class comes back.
      - name: shellcheck the step script extracted from action.yml
        run: |
          set -euo pipefail
          python3 - action.yml > /tmp/mirror.sh <<'PY'
          import sys, yaml
          doc = yaml.safe_load(open(sys.argv[1]))
          step = [s for s in doc["runs"]["steps"] if s.get("id") == "mirror"][0]
          sys.stdout.write("#!/usr/bin/env bash\n" + step["run"])
          PY
          shellcheck -s bash --severity=warning /tmp/mirror.sh tests/run-tests.sh tests/mutations.sh

  # The behaviour suite drives the script directly. This is the only thing that
  # proves the ACTION works: that a workflow can consume it by path, that the env
  # exports reach a LATER step (a $GITHUB_ENV write is invisible within the step
  # that made it), and that the output points at the file that was written.
  consumer:
    name: Consume the action end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # hardening-exception: egress-audit — this job clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: mirror
        uses: ./
        with:
          mirror-url: https://mirror.example.com/tf/
          binary: tofu
          allow-direct-fallback: "true"
          direct-include-patterns: registry.terraform.io/hashicorp/*

      - name: The exports and the output reach a later step
        env:
          CONFIG_FILE_PATH: ${{ steps.mirror.outputs.config-file-path }}
        run: |
          set -euo pipefail
          test -n "$CONFIG_FILE_PATH"
          test "$TF_CLI_CONFIG_FILE" = "$CONFIG_FILE_PATH"
          test "$TOFU_CLI_CONFIG_FILE" = "$CONFIG_FILE_PATH"
          grep -Fqx '    url = "https://mirror.example.com/tf/"' "$CONFIG_FILE_PATH"
          grep -Fq 'include = ["registry.terraform.io/hashicorp/*"]' "$CONFIG_FILE_PATH"
